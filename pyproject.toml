[project]
name = "codeguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "keyring",
    "tomli",
    "openai",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]