[agent]
workspace = "./demo_project"
max_steps = 10
command_timeout = 30
max_file_size = 100000
allowed_commands = ["python", "pytest", "ruff", "mypy", "git diff", "git status"]
protected_files = [".env", ".git", "*.pem", "*.key"]
allowed_extensions = [".py", ".json", ".toml", ".md", ".txt"]
auto_finish_on_test_pass = false
log_level = "info"
high_size_threshold = 10240
forbidden_shell_chars = [";", "|", "&", ">", "<", "`", "$("]