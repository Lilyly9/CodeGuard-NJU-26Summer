# CodeGuard 默认配置文件
# 所有字段均有默认值，缺失字段自动回退

[agent]
# 工作目录（Agent 所有操作限制在此目录内）
workspace = "."

# 最大步数（Agent 主循环最多执行多少轮）
max_steps = 10

# 命令超时时间（秒）
command_timeout = 30

# 文件最大读取/写入大小（字节）
max_file_size = 100000

# 测试全部通过后自动停止（true = 所有测试通过即停机）
auto_finish_on_test_pass = true

# 允许执行的命令白名单
allowed_commands = [
    "pytest",
    "python",
    "ruff",
    "git diff",
    "git status",
]

# 受保护的文件/目录模式（黑名单优先）
protected_files = [
    ".env",
    "*.pem",
    "*.key",
    ".git",
]